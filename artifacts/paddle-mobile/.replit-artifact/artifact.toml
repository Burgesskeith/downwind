kind = "mobile"
previewPath = "/mobile/"
title = "Paddle Planner Mobile"
version = "1.0.0"
id = "artifacts/paddle-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 18508

[services.development]
run = "pnpm --filter @workspace/paddle-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paddle-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/paddle-mobile", "run", "serve" ]

[services.env]
PORT = "18508"
BASE_PATH = "/mobile/"
